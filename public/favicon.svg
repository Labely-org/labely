<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Stack Layer 1 (Top Diamond) -->
  <polygon points="32,11 54,22 32,33 10,22" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Stack Layer 2 (Middle Chevron) -->
  <polyline points="10,32 32,43 54,32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stack Layer 3 (Bottom Chevron) -->
  <polyline points="10,43 32,54 54,43" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>